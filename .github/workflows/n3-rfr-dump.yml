name: n3-rfr-dump
# N3 probe: who is github.actor / github.event.sender on ready_for_review?
on:
  pull_request:
    types: [opened, ready_for_review, converted_to_draft]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: dump identities
        env:
          EV_ACTOR: ${{ github.actor }}
          EV_SENDER: ${{ github.event.sender.login }}
          EV_ACTION: ${{ github.event.action }}
          EV_AUTHOR: ${{ github.event.pull_request.user.login }}
          EV_DRAFT: ${{ github.event.pull_request.draft }}
          EV_REF: ${{ github.ref }}
        run: |
          echo "event-identities actor=$EV_ACTOR sender=$EV_SENDER action=$EV_ACTION author=$EV_AUTHOR draft=$EV_DRAFT ref=$EV_REF"
